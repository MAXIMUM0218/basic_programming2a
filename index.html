<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脳トレ：Touch the Numbers タイムアタック</title>
    <style>
        /* 全体のスタイリング */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            color: #333;
        }

        #game-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #1e293b;
        }

        p.description {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* タイム表示 */
        #timer {
            font-size: 2.5rem;
            font-family: monospace;
            font-weight: bold;
            color: #0f172a;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        /* 5x5のグリッドレイアウト */
        #board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        /* 数字ボタンのスタイリング */
        .number-btn {
            width: 100%;
            aspect-ratio: 1; 
            font-size: 1.4rem;
            font-weight: bold;
            background-color: #e2e8f0;
            color: #334155;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .number-btn:active {
            transform: scale(0.92);
            background-color: #cbd5e1;
        }

        .number-btn.clicked {
            background-color: #3b82f6;
            color: white;
            cursor: default;
            transform: scale(1);
            opacity: 0.8;
        }

        .number-btn.error {
            background-color: #ef4444;
            color: white;
            animation: shake 0.3s;
        }

        /* スタートボタン */
        #start-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        #start-btn:hover {
            background-color: #059669;
        }

        /* 表示切り替え用クラス */
        .hidden {
            display: none !important;
        }

        /* メッセージ表示エリア */
        #message {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            min-height: 1.5em;
        }

        /* クーポン結果表示エリア */
        #coupon {
            margin-top: 15px;
            margin-bottom: 15px;
            padding: 15px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* クーポンのランク別装飾 */
        .coupon-gold { background-color: #fef08a; color: #854d0e; border: 2px dashed #eab308; }
        .coupon-silver { background-color: #f1f5f9; color: #334155; border: 2px dashed #94a3b8; }
        .coupon-bronze { background-color: #ffedd5; color: #9a3412; border: 2px dashed #f97316; }
        .coupon-none { background-color: #f3f4f6; color: #6b7280; font-size: 0.95rem; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Touch the Numbers</h1>
        <p class="description">
            15秒以内：学食30%割引<br>
            20秒以内：売店30円引き / 25秒以内：売店10円引き
        </p>
        
        <div id="message"></div>
        <div id="timer">0.000</div>
        
        <div id="coupon" class="hidden"></div>

        <div id="board" class="hidden"></div>
        
        <button id="start-btn">スタート</button>
    </div>

    <script>
        const board = document.getElementById('board');
        const startBtn = document.getElementById('start-btn');
        const timerDisplay = document.getElementById('timer');
        const messageDisplay = document.getElementById('message');
        const couponDisplay = document.getElementById('coupon');

        let currentTarget = 1;
        let startTime = 0;
        let timerInterval = null;
        let isPlaying = false;

        startBtn.addEventListener('click', startGame);

        function startGame() {
            currentTarget = 1;
            messageDisplay.textContent = " ";
            timerDisplay.textContent = "0.000";
            
            // クーポン表示をリセットして隠す
            couponDisplay.classList.add('hidden');
            couponDisplay.className = 'hidden'; // クラスの初期化
            
            startBtn.classList.add('hidden');
            board.classList.remove('hidden');

            createBoard();

            startTime = Date.now();
            isPlaying = true;
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 10);
        }

        function createBoard() {
            board.innerHTML = ""; 
            let numbers = Array.from({length: 25}, (_, i) => i + 1);
            
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            numbers.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'number-btn';
                btn.textContent = num;
                
                const interactEvent = ('ontouchstart' in window) ? 'touchstart' : 'mousedown';
                btn.addEventListener(interactEvent, (e) => {
                    e.preventDefault(); 
                    handleNumberClick(btn, num);
                });
                
                board.appendChild(btn);
            });
        }

        function handleNumberClick(btn, num) {
            if (!isPlaying || btn.classList.contains('clicked')) return;

            if (num === currentTarget) {
                btn.classList.add('clicked');
                currentTarget++;

                if (currentTarget > 25) {
                    endGame();
                }
            } else {
                btn.classList.add('error');
                setTimeout(() => btn.classList.remove('error'), 300);
            }
        }

        function updateTimer() {
            const elapsedTime = (Date.now() - startTime) / 1000;
            timerDisplay.textContent = elapsedTime.toFixed(3);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            
            const finalTime = (Date.now() - startTime) / 1000;
            timerDisplay.textContent = finalTime.toFixed(3);
            
            // 盤面を隠して結果を見やすくする
            board.classList.add('hidden');
            couponDisplay.classList.remove('hidden');

            // タイムに応じたクーポンの判定と表示
            if (finalTime <= 15.0) {
                messageDisplay.textContent = "驚異的なスピード！ 🎉";
                couponDisplay.textContent = "🎁 【学食orバン30%割引券】獲得！";
                couponDisplay.classList.add('coupon-gold');
            } else if (finalTime <= 20.0) {
                messageDisplay.textContent = "素晴らしいタイム！ 👏";
                couponDisplay.textContent = "🎁 【売店30円引き】獲得！";
                couponDisplay.classList.add('coupon-silver');
            } else if (finalTime <= 25.0) {
                messageDisplay.textContent = "クリア！お見事！ 👍";
                couponDisplay.textContent = "🎁 【売店10円引き】獲得！";
                couponDisplay.classList.add('coupon-bronze');
            } else {
                messageDisplay.textContent = "クリア！次はもっと早く！ 🏃";
                couponDisplay.textContent = "今回は割引なし（25秒以内でクーポン獲得）";
                couponDisplay.classList.add('coupon-none');
            }
            
            setTimeout(() => {
                startBtn.textContent = "もう一度プレイ";
                startBtn.classList.remove('hidden');
            }, 500);
        }
    </script>
</body>
</html>
